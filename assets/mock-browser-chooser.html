<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LTE Stick View, browser chooser mock</title><link rel="stylesheet" href="mock.css"></head>
<body>
<div class="win">
  <div class="bar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><span class="title">LTE Stick View</span></div>
  <div class="body">
    <p class="sub" style="margin:0 0 10px">the five status lines as in the main window</p>
    <div style="display:flex;gap:8px;align-items:flex-start">
      <div>
        <span class="btn primary">Open stick page…</span>
        <div class="menu">
          <div class="opt"><span class="dot green"></span>Built-in viewer<span class="sub">WebKit, in the app</span></div>
          <div class="opt"><span class="dot green"></span>Google Chrome<span class="sub">last used</span></div>
          <div class="opt"><span class="dot green"></span>Firefox<span class="sub">temporary profile</span></div>
          <div class="opt"><span class="dot green"></span>Microsoft Edge<span class="sub">separate profile</span></div>
          <div class="opt off"><span class="dot hollow"></span>Safari<span class="sub">system proxy only</span></div>
          <div class="opt off"><span class="dot hollow"></span>Arc<span class="sub">ignores launch options</span></div>
        </div>
      </div>
      <span class="hint">closing this window ends the tunnel</span><span class="btn" style="margin-left:12px">Quit</span>
    </div>
  </div>
</div>
</body></html>
